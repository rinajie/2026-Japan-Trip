<title>日本教育旅行・互動手冊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#4a3320;--sub:#8a7360;--pink:#e8731a;--mint:#9ad68b;--sun:#ffd54a;--sky:#ffc27a;--line:#ffe0b0;--sh:0 6px 0 rgba(232,115,26,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

:root[data-theme="dark"]{--bg:#2b2117;--card:#3a2d20;--ink:#fff3e2;--sub:#d1bb9f;--line:#5a4430;--pink:#ff9a3d;--sh:0 6px 0 rgba(0,0,0,.3)}

.wrap{max-width:820px;margin:0 auto;padding:14px 14px 110px}
.hero{text-align:center;padding:8px 0}

.sub{color:var(--sub);margin:2px 0}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}

.btn:active{transform:translateY(3px);box-shadow:none}
details{background:var(--card);border:3px solid var(--line);border-radius:20px;margin:10px 0;overflow:hidden}
summary{padding:12px 16px;font-weight:900;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:var(--pink)}
details[open] summary::after{content:"－"}
details>div{padding:0 16px 14px}
details[open]{border-color:var(--pink)}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.spot{background:var(--bg);border-radius:14px;padding:8px 12px;margin:8px 0}
.spot b{color:var(--pink)}
.meal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:13px}
.meal div{background:var(--bg);border-radius:12px;padding:6px 8px}
.meal i{font-style:normal;display:block;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 8px;border-bottom:2px dashed var(--line);text-align:left;vertical-align:top}
.chips span{display:inline-block;background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:1px 10px;margin:3px 3px 0 0;font-weight:700;font-size:14px}
.chips span.lead{background:var(--sun);border-color:var(--sun);color:#4a3b52}
input[type=text]{width:100%;border:3px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:10px 14px;font:inherit;font-weight:700;outline:none}
input[type=text]:focus{border-color:var(--pink)}
.res{margin-top:10px}
.me{display:flex;align-items:center;gap:10px;background:var(--bg);padding:8px 12px;border-radius:14px;margin:6px 0;cursor:pointer}
.me label{flex:1;cursor:pointer}.me.ok{opacity:.55;text-decoration:line-through}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--sun));width:0;transition:.3s}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line)}
.ph b{font-size:17px}.ph small{color:var(--sub);display:block}
.ph .r{color:var(--pink);font-size:13px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1 0 62px;border:0;background:none;color:var(--sub);font:inherit;font-size:11px;font-weight:700;padding:4px 2px;border-radius:14px;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{background:var(--pink);color:#fff;transform:translateY(-3px)}
.warn{border-color:var(--sun)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700;transition:.3s;z-index:9}
.toast.show{transform:translate(-50%,0)}
.sec{display:none;animation:in .3s}.sec.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
</style>
</head>

["離別與用餐",[["留下美好的回憶","良い思い出になりました","yo-i o-mo-i-de ni na-ri-ma-shi-ta"],["今天很愉快","今日、楽しかったです","kyo-u ta-no-shi-ka-t-ta de-su"],["開動了","いただきます","i-ta-da-ki-ma-su"]]]];
const SOS=[["日本東京辦事處","(03)3280-7811"],["緊急聯絡電話","080-6552-4764"],["外交部駐外館處緊急專線","001-800-0885-0885"],["海外救援 24 小時專線","001+010+886+2-2511-9266"]];
let S={};try{S=JSON.parse(localStorage.getItem("trip")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("trip",JSON.stringify(S))}catch(e){}};
const chips=a=>`<div class="chips">${a.map(n=>`<span>${E(n)}</span>`).join("")}</div>`;
const V={
home(){const d=Math.ceil((new Date(2026,11,7)-new Date(new Date().toDateString()))/864e5);
return `<div class="card cd">${d>0?`<small>距離出發還有</small><big>${d} 天</big>`:d==0?`<big>今天出發！🛫</big>`:`<big>旅程進行中 ✨</big>`}</div>
<div class="card"><h2>🛫 出發資訊</h2><div class="row"><div class="mini"><b>集合</b><br>12/7 早上 3:20<br>臺南二中校門口</div><div class="mini"><b>出發</b><br>早上 3:30</div><div class="mini"><b>人數</b><br>33 + 1 人</div></div></div>
<div class="card"><h2>✈️ 航班</h2><table><tr><td>12/7（一）</td><td>高雄 → 大阪<br>BR182</td><td>07:05 → 10:55</td></tr><tr><td>12/12（六）</td><td>大阪 → 高雄<br>BR181</td><td>11:55 → 14:30</td></tr></table></div>
<div class="card"><h2>🏨 住宿</h2>${HOTELS.map(h=>`<div class="ph"><div><b>${h[2]}</b><small>${h[0]} ${h[1]}</small></div><div class="r">${h[3].startsWith("+")?`<a href="tel:${h[3].replace(/-/g,"")}">${h[3]}</a>`:h[3]}</div></div>`).join("")}</div>
<p class="sub" style="text-align:center">行程順序可能因學校、天候與交通調整，但景點不會減少。</p>`},
plan(){return `<p class="sub">點開看每天的景點與餐食 👇</p>`+DAYS.map((d,i)=>`<details ${i==0?"open":""}><summary>Day ${i+1}｜${d[0]}　${d[1]}</summary><div><p><b>${d[2]}</b></p>${d[3].map(s=>`<div class="spot"><b>${s[0]}</b><br>${s[1]}</div>`).join("")}<div class="meal"><div><i>🌅 早</i>${d[4][0]}</div><div><i>☀️ 午</i>${d[4][1]}</div><div><i>🌙 晚</i>${d[4][2]}</div></div></div></details>`).join("")},
ppl(){return `<div class="card"><h2>🔍 找我的行程</h2><input type="text" id="q" placeholder="輸入姓名，例如 黃安綺"><div class="res" id="res"></div></div>
<div class="card"><h2>👩‍🏫 帶隊師長</h2><div class="chips">${TEA.map((n,i)=>`<span class="lead">${TR[i]}｜${n}</span>`).join("")}</div></div>
${GR.map((g,i)=>`<div class="card"><h2>第${CN[i]}組</h2><div class="chips"><span class="lead">組長 ${g[0]}</span>${g.slice(1).map(n=>`<span>${n}</span>`).join("")}</div></div>`).join("")}`},
sch(){return `<div class="card"><h2>🏫 岡山縣立林野高等學校</h2><p>位於岡山縣北東部美作市的全日制普通高中，1908 年創立，前身為倉敷女子學校，2018 年迎來創校 110 週年。2004 年與大原高校、2007 年與英田商業高校整併後，成為美作市唯一的公立高中。</p><p><span class="tag">教育目標</span>培養有智慧與文化、身心健康、獨立自主的人；具備邏輯思考、創造力與解決問題能力；透過主動參與社會，培養人際能力。</p></div>
<div class="card"><h2>📅 12/8（二）10:00–16:00</h2><table>${[["10:00","抵達學校"],["10:30–11:15","歡迎儀式"],["11:25–12:10","入班上課"],["12:10–12:55","午餐交流"],["12:55–13:40","入班上課"],["13:50–15:30","團體活動（烹飪、劍道、茶道及古箏）"],["16:00","離開"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table></div>
<div class="card"><h2>🎎 12/8 團體活動分組</h2>${Object.entries(ACT).map(([k,v])=>`<p><span class="tag">${k}</span></p>${chips(v.split(" "))}`).join("")}</div>
<div class="card"><h2>📅 12/9（三）8:30–12:30</h2><table>${[["8:30","抵達學校"],["8:40–10:20","Show & Tell 活動"],["10:30–12:10","歡送會及午餐"],["12:30","離開"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table></div>`},
host(){return `<div class="card warn"><h2>🏡 寄宿家庭分配（12/9）</h2><p class="sub">過夜包要帶好喔！</p>${Object.entries(FAM).map(([f,m])=>`<p><span class="tag">${f}</span></p>${chips(m.split(" "))}`).join("")}</div>
<h2>📜 寄宿家庭注意事項</h2>${HR.map((t,i)=>`<div class="me" style="cursor:default"><b style="color:var(--pink)">${i+1}</b><span>${t}</span></div>`).join("")}`},
tips(){return TIPS.map(t=>`<details><summary>${t[0]}</summary><div><ul>${t[1].map(x=>`<li>${x}</li>`).join("")}</ul></div></details>`).join("")},
pack(){const c=S.pack||{},n=PK.filter((_,i)=>c[i]).length;return `<div class="card"><h2>🎒 行李清單小幫手</h2><div class="bar"><i style="width:${n/PK.length*100}%"></i></div><p class="sub">已準備 ${n} / ${PK.length} 項 ${n==PK.length?"🎉":""}</p><button class="btn" id="rst">重新開始</button></div>`+PK.map((t,i)=>`<div class="me ${c[i]?"ok":""}"><input type="checkbox" id="k${i}" data-k="${i}" ${c[i]?"checked":""}><label for="k${i}">${t}</label></div>`).join("")},
jp(){return `<p class="sub">點「複製」可以貼給日本朋友看 😊</p>`+JP.map((g,i)=>`<details ${i==0?"open":""}><summary>${g[0]}</summary><div>${g[1].map(p=>`<div class="ph"><div><b>${p[1]}</b><small>${p[0]}｜${p[2]}</small></div><button class="btn" data-c="${E(p[1])}">複製</button></div>`).join("")}</div></details>`).join("")},
sos(){return `<div class="card warn"><h2>🚨 日本緊急電話</h2><div class="row"><a class="btn tel" href="tel:110" style="background:#7cc4f0">警察 110</a><a class="btn tel" href="tel:119" style="background:#ef5b4c;color:#fff">急救・火警 119</a></div></div>
<div class="card"><h2>📞 緊急聯絡</h2>${SOS.map(s=>`<div class="ph"><div><b>${s[0]}</b></div><a class="btn" href="tel:${s[1].replace(/[^\d+]/g,"")}">${s[1]}</a></div>`).join("")}</div>
<div class="card"><h2>🦠 傳染病預防</h2><ul><li>用肥皂勤洗手、吃熟食、喝瓶裝水。</li><li>噴防蚊液，避免蚊蟲叮咬。</li><li>不接觸禽鳥、犬貓與野生動物。</li><li>自備口罩、乾洗手與常備藥品。</li></ul></div><p class="sub" style="text-align:center">祝您一路順風，旅途愉快！🍊</p>`}};
let cur=localStorage.getItem?"home":"home";
function go(k){cur=k;$("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]==k?"on":""}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");$("#v").innerHTML=`<div class="sec on">${V[k]()}</div>`;scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t]");if(t){go(t.dataset.t);return}
const c=e.target.closest("[data-c]");if(c){const x=c.dataset.c,ok=()=>toast("已複製 ✨");(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(ok).catch(()=>{const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(_){}a.remove()})}
if(e.target.id==="rst"){S.pack={};save();go("pack")}});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k!==undefined){(S.pack=S.pack||{})[k]=e.target.checked;save();const y=scrollY;go("pack");scrollTo(0,y)}});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;const q=e.target.value.trim(),r=$("#res");if(!q){r.innerHTML="";return}
const hit=[...TEA,...GR.flat()].filter(n=>n.includes(q));
r.innerHTML=hit.length?hit.slice(0,5).map(n=>{const g=GR.findIndex(x=>x.includes(n)),a=Object.keys(ACT).find(k=>ACT[k].includes(n)),f=Object.keys(FAM).find(k=>FAM[k].includes(n));
return g<0?`<div class="mini" style="margin:6px 0"><b>${n}</b>｜${TR[TEA.indexOf(n)]}，帶隊師長 👩‍🏫</div>`:`<div class="mini" style="margin:6px 0"><b>${n}</b>｜第${CN[g]}組${GR[g][0]==n?"（組長）":""}<br>🎎 12/8 活動：${a}<br>🏡 12/9 寄宿：${f}</div>`}).join(""):`<p class="sub">找不到這個名字 🐾</p>`});
go("home");
</script>
